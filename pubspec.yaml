name: smoke_signal

description: Purposely simple/manual live activity social media app. Ping your friends when you start a potential group activity, so they know vibes are afoot!

publish_to: none

version: 1.0.0

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  # Google
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  firebase_core: ^3.4.1
  firebase_auth: ^5.2.1
  firebase_messaging: ^15.1.1
  cloud_firestore: ^5.4.1

  # Community
  # empathetech_flutter_ui: ^1.1.4
  # empathetech_ss_api: ^1.0.1
  empathetech_flutter_ui:
    path: ../empathetech_flutter_ui
  empathetech_ss_api:
    path: ../empathetech_ss_api
  cached_network_image: ^3.4.1
  flutter_platform_widgets: ^7.0.1

dev_dependencies:
  dependency_validator: ^4.1.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

# App configuration
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/app-icon.png
    - assets/dark-forest.png
    - assets/smoke-signal.gif

flutter_icons:
  image_path: assets/app-icon.png
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_background: "#A520DA"
  android: true
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#A520DA"
  image: assets/app-icon.png
