name: smoke_signal
description: "An intentional and Empathetech social media design to keep us off our phones. Powered by Activity Pub."
version: 2.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.4.1
  firebase_core: ^3.10.1
  intl: ^0.19.0
  go_router: ^14.7.2
  shared_preferences: ^2.4.0

  # Community
  feedback: ^3.1.0
  cached_network_image: ^3.4.1
  flutter_localized_locales: ^2.0.5
  flutter_platform_widgets: ^7.0.1

  empathetech_flutter_ui:
    path: ../empathetech_flutter_ui
  empathetech_ss_api:
    path: ../empathetech_ss_api

dev_dependencies:
  dependency_validator: ^5.0.2
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/fonts/Roboto-Black.ttf
    - assets/fonts/Roboto-BlackItalic.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-BoldItalic.ttf
    - assets/fonts/Roboto-Italic.ttf
    - assets/fonts/Roboto-Light.ttf
    - assets/fonts/Roboto-LightItalic.ttf
    - assets/fonts/Roboto-Medium.ttf
    - assets/fonts/Roboto-MediumItalic.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Thin.ttf
    - assets/fonts/Roboto-ThinItalic.ttf
    - assets/images/
    - assets/images/app-icon.png
    - assets/images/dark-forest.png
    - assets/images/light-forest.png
    - assets/images/smoke-signal.gif

flutter_launcher_icons:
  image_path: assets/images/app-icon.png
  adaptive_icon_foreground: assets/images/app-icon.png
  adaptive_icon_background: "#A520DA"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#A520DA"
  image: assets/images/app-icon.png
  android: true
  ios: true
  web: true
